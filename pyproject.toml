# this_file: pyproject.toml
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "fly-january"
dynamic = ["version"]
description = "FontLab/Vexy documentation theme for ProperDocs, extending MaterialX"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mkdocs>=1.6.1",
  "mkdocs-materialx>=10.1.8",
  "properdocs>=1.6.7",
  "vexy-python-markdown-figure-groups",
]

[project.entry-points."mkdocs.themes"]
fly-january = "fly_january"

[project.entry-points."mkdocs.plugins"]
fly = "fly_january.plugin:FlyPlugin"
# MkDocs prefers "<theme name>/<plugin>" over the bare name, which is how MaterialX makes a
# bare "search" mean its own search. fly-january extends MaterialX, so it repeats them
# (tests/py/test_defaults.py keeps this list equal to the installed mkdocs-materialx).
"fly-january/blog" = "material.plugins.blog.plugin:BlogPlugin"
"fly-january/group" = "material.plugins.group.plugin:GroupPlugin"
"fly-january/info" = "material.plugins.info.plugin:InfoPlugin"
"fly-january/meta" = "material.plugins.meta.plugin:MetaPlugin"
"fly-january/offline" = "material.plugins.offline.plugin:OfflinePlugin"
"fly-january/optimize" = "material.plugins.optimize.plugin:OptimizePlugin"
"fly-january/privacy" = "material.plugins.privacy.plugin:PrivacyPlugin"
"fly-january/search" = "material.plugins.search.plugin:SearchPlugin"
"fly-january/social" = "material.plugins.social.plugin:SocialPlugin"
"fly-january/tags" = "material.plugins.tags.plugin:TagsPlugin"

[dependency-groups]
dev = [
  "properdocs==1.6.7",
  "mkdocs==1.6.1",
  "mkdocs-materialx==10.1.8",
  "pymdown-extensions==11.0.1",
  "pytest>=8",
  "ruff",
]
# The demo site's own plugins (src_docs/mkdocs.yml), pinned as on the Marketing site.
site = [
  "mkdocs-glightbox==0.5.2",
  "mkdocs-awesome-nav==3.3.0",
  "vexy-mkdocs-strip-number-prefix==1.0.12",
  "Markdown==3.10.2",
  "mkdocs-material-extensions==1.3.1",
  "beautifulsoup4==4.14.3",
]

[tool.uv.sources]
# Local checkout until the package is published; removed at release (Task 12).
vexy-python-markdown-figure-groups = { path = "../../github.vexyart/vexy-python-markdown-figure-groups", editable = true }

[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version" }

[tool.hatch.build.hooks.vcs]
version-file = "theme/fly_january/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["theme/fly_january"]

[tool.pytest.ini_options]
testpaths = ["tests/py"]

[tool.ruff]
line-length = 100
