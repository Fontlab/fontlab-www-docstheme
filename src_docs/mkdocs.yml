# this_file: src_docs/mkdocs.yml
# The fly-january demo site: theme reference (md/theme/) and the design-pattern pages
# migrated from Marketing/src_docs. Built by ../build.sh into ../docs (GitHub Pages).
site_name: FontLab web design system
site_description: The fly-january documentation theme and the FontLab web design patterns.
site_url: https://fontlab.dev/fontlab-www-docstheme/
site_author: Fontlab Ltd.

docs_dir: md
# ../build.sh builds into a temporary directory and syncs it into ../docs around docs/fly
# (the CDN tree); a direct `properdocs build` writes here instead.
site_dir: site

use_directory_urls: true

hooks:
  - hooks/compiled_examples.py
  - hooks/page_scripts.py

exclude_docs: |
  /nav.yml
  includes/**

not_in_nav: |
  renderer-capabilities.md

theme:
  name: fly-january
  font: false
  code:
    fold:
      enabled: true
  features:
    - navigation.path
    - navigation.tabs
    - navigation.top
    - toc.follow
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.footnote.tooltips
    - content.tooltips
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true
      title: Contents
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path:
        - md
      auto_append:
        - includes/renderer-glossary.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.blocks.caption
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: false
  - pymdownx.tilde
  - material.extensions.code_download

plugins:
  - fly
  - materialx/meta
  - materialx/search:
      enabled: true
  - glightbox
  - strip-number-prefix:
      enabled: true
      pattern: '^\d+-'
  - awesome-nav:
      filename: nav.yml

extra:
  fly:
    chrome: fontlab
    chrome_options:
      site-label: Design system
      search-from: docstheme
    hue: cobalt

# The Basecoat/daisyUI component bundle comes from this site's own CDN tree (docs/fly/,
# written by npm run build), so the field-guide pages render the release they document.
extra_css:
  - fly/latest/components.css
  - assets/stylesheets/component-reference.css
  - assets/stylesheets/field-guide.css
  - assets/stylesheets/patterns.css
  - assets/stylesheets/theme-pages.css

extra_javascript:
  - fly/latest/basecoat.js
  - assets/javascripts/component-reference.js
  - assets/javascripts/compiled-examples.js
  - path: assets/javascripts/fontlab-prompt.js
    type: module
